<figure class="fig" id="fig-claims-parties">
<div class="figscroll">
<svg viewBox="0 0 1000 498" role="img" aria-label="Four seats and the claims between them. Each driver claims under their own policy with their own insurer, and may claim against the other driver's insurer for property damage. Each adjuster therefore keeps two files: its insured under the policy, and the other driver against its insured. The insurer that paid its insured demands it back from the other insurer, and a forum decides when the two cannot agree. The police records desk, a witness, the repair shops, the appraisers, the rental company and the forum are played by the world.">
  <defs>
    <marker id="ah-cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>

  <rect class="b k-agent" x="40" y="24" width="290" height="84" rx="4"/>
  <text x="56" y="52" class="t-title">driver_a · Alex Rivera</text>
  <text x="56" y="74" class="t-sub">insured of Harbor Mutual</text>
  <text x="56" y="92" class="t-sub">claimant against Pacific Crest</text>

  <rect class="b k-agent" x="670" y="24" width="290" height="84" rx="4"/>
  <text x="686" y="52" class="t-title">driver_b · Blake Chen</text>
  <text x="686" y="74" class="t-sub">insured of Pacific Crest</text>
  <text x="686" y="92" class="t-sub">claimant against Harbor Mutual</text>

  <rect class="b k-agent" x="40" y="236" width="290" height="84" rx="4"/>
  <text x="56" y="264" class="t-title">adjuster_a · Harbor Mutual</text>
  <text x="56" y="286" class="t-sub">file 1: its insured, under the policy</text>
  <text x="56" y="304" class="t-sub">file 2: the other driver, against its insured</text>

  <rect class="b k-agent" x="670" y="236" width="290" height="84" rx="4"/>
  <text x="686" y="264" class="t-title">adjuster_b · Pacific Crest</text>
  <text x="686" y="286" class="t-sub">file 1: its insured, under the policy</text>
  <text x="686" y="304" class="t-sub">file 2: the other driver, against its insured</text>

  <line class="ln" x1="110" y1="108" x2="110" y2="236" marker-start="url(#ah-cp)" marker-end="url(#ah-cp)"/>
  <text x="122" y="168">own policy</text>
  <text x="122" y="186" class="t-sub">collision · rental</text>

  <line class="ln" x1="890" y1="108" x2="890" y2="236" marker-start="url(#ah-cp)" marker-end="url(#ah-cp)"/>
  <text x="878" y="168" text-anchor="end">own policy</text>
  <text x="878" y="186" text-anchor="end" class="t-sub">collision · rental</text>

  <path class="ln" d="M300 108 V152 H740 V236" marker-end="url(#ah-cp)"/>
  <path class="ln" d="M700 108 V192 H260 V236" marker-end="url(#ah-cp)"/>
  <text x="500" y="177" text-anchor="middle">liability claim against the other driver's insurer</text>

  <line class="ln" x1="330" y1="292" x2="670" y2="292" marker-start="url(#ah-cp)" marker-end="url(#ah-cp)"/>
  <text x="500" y="262" text-anchor="middle">the insurer that paid demands it back</text>
  <text x="500" y="280" text-anchor="middle" class="t-sub">at the other driver's share, with the deductible</text>

  <rect class="k-frame" x="28" y="346" width="944" height="138" rx="8"/>
  <text x="44" y="368" class="t-sub">Played by the world</text>

  <line class="ln ln-dash" x1="500" y1="292" x2="500" y2="358" marker-end="url(#ah-cp)"/>
  <text x="510" y="334" class="t-sub">when they cannot agree</text>
  <rect class="b k-task" x="400" y="358" width="200" height="50" rx="4"/>
  <text x="500" y="379" text-anchor="middle" class="t-title">the forum</text>
  <text x="500" y="397" text-anchor="middle" class="t-sub">decides on what is filed</text>

  <rect class="b k-task" x="44" y="424" width="168" height="46" rx="4"/>
  <text x="128" y="443" text-anchor="middle" class="t-title">police records desk</text>
  <text x="128" y="460" text-anchor="middle" class="t-sub">the report, days later</text>

  <rect class="b k-task" x="230" y="424" width="168" height="46" rx="4"/>
  <text x="314" y="443" text-anchor="middle" class="t-title">witness</text>
  <text x="314" y="460" text-anchor="middle" class="t-sub">a statement, when asked</text>

  <rect class="b k-task" x="416" y="424" width="168" height="46" rx="4"/>
  <text x="500" y="443" text-anchor="middle" class="t-title">repair shops</text>
  <text x="500" y="460" text-anchor="middle" class="t-sub">estimate, supplement, bill</text>

  <rect class="b k-task" x="602" y="424" width="168" height="46" rx="4"/>
  <text x="686" y="443" text-anchor="middle" class="t-title">appraisers</text>
  <text x="686" y="460" text-anchor="middle" class="t-sub">checks every estimate</text>

  <rect class="b k-task" x="788" y="424" width="168" height="46" rx="4"/>
  <text x="872" y="443" text-anchor="middle" class="t-title">rental company</text>
  <text x="872" y="460" text-anchor="middle" class="t-sub">bills by the day</text>
</svg>
</div>
<figcaption>Each driver stands in two relations and each adjuster keeps two files. The same car can be paid for along two routes, so what one insurer pays the other must not pay again, and the two insurers settle the rest between themselves.</figcaption>
</figure>
