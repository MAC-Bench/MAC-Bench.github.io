<figure class="fig" id="fig-claims-pipeline">

  <defs>
    <marker id="ah-cl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  </defs>

  <text x="840" y="204" class="t-sub">handbook, the scripts</text>
  <text x="840" y="222" class="t-sub">and the score</text>
  <text x="840" y="262">clocks</text>
  <text x="840" y="282" class="t-sub">15, 40 and 30 days</text>
  <text x="840" y="322">liability guide</text>

  <text x="840" y="496">evidence</text>
  <text x="840" y="516" class="t-sub">what proves a fact</text>
</svg>

<figcaption>One episode of one task. The seats under test act only through the interface. Everything else is the world or a script, and no model sits inside either. The score is computed from the sealed record after it has replayed.</figcaption>
